services:
  mogent-cloud:
    build: .
    container_name: mogent-telegram-cloud
    restart: always
    ports:
      - "80:5000"
    environment:
      - PORT=5000
      - BOT_RUNNER_MODE=polling
      - APP_ENCRYPTION_KEY=mogent-secure-master-key-2026-production-vault-32char
      - JWT_SECRET=mogent-jwt-secret-key-2026-production-token
      - GODMODE_SECRET_TOKEN=hkjhl-sadmin-godmode-2026
      - SQLITE_DB_PATH=/app/data/mogent.sqlite
    volumes:
      - mogent_data:/app/data
    deploy:
      resources:
        limits:
          memory: 600M


volumes:
  mogent_data:
